[project]
name = "customer-support-agent-v2"
version = "0.1.0"
description = "AI-powered customer support ticket classification with LangChain"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Core web app
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    # LangChain for app_langchain.py
    "langchain==0.3.27",
    "langchain-openai==0.3.29",
    "langchain-community==0.3.27",
    "langchain-core>=0.3.0",
    # Database
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "supabase>=2.0.0",
]

